name: CPU Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute End-to-End Pipeline Smoke Test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python main_demo.py

      - name: Execute Presentation Script Walkthrough
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python demo_script.py

      - name: Execute Quick Reference & Flowchart
        run: |
          python quick_reference.py
