name: Stale Issue & PR Triage

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 14 days if no further activity occurs. Please comment if it is still relevant!"
          stale-pr-message: "This pull request has been automatically marked as stale due to 60 days of inactivity. It will be closed in 14 days if no further activity occurs."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,help wanted,good first issue"
          exempt-pr-labels: "pinned,work-in-progress,WIP"
