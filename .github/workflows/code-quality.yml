name: Code Quality & Metadata Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install check-manifest pyyaml tomli

      - name: Validate TOML and YAML Syntax
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb')); print('pyproject.toml valid!')"
          python -c "import yaml; yaml.safe_load(open('CITATION.cff', 'r', encoding='utf-8')); print('CITATION.cff valid!')"
