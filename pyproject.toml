[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-ml-zero-budget"
version = "0.1.0"
description = "Training real scientific machine learning models on free-tier Colab and Kaggle GPUs."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Samudragupta Nag", email = "arrhatnag1@gmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
keywords = [
    "scientific-machine-learning",
    "pytorch",
    "google-colab",
    "kaggle",
    "mixed-precision",
    "gradient-accumulation",
    "checkpointing",
    "frugal-computing",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0,<2.0.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "psutil>=5.9.0",
    "tqdm>=4.64.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[project.urls]
Homepage = "https://github.com/samudragupto/scientific-ml-zero-budget"
Repository = "https://github.com/samudragupto/scientific-ml-zero-budget.git"
Issues = "https://github.com/samudragupto/scientific-ml-zero-budget/issues"
Discussions = "https://github.com/samudragupto/scientific-ml-zero-budget/discussions"

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["utils", "main_demo"]
omit = ["tests/*", "setup_colab.py"]
